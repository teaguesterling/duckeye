name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pandoc unzip

      - name: Install DuckDB
        run: |
          curl -fsSL "https://github.com/duckdb/duckdb/releases/latest/download/duckdb_cli-linux-amd64.zip" \
            -o /tmp/duckdb.zip
          unzip /tmp/duckdb.zip -d /tmp
          sudo install /tmp/duckdb /usr/local/bin/
          duckdb --version

      - name: Initialize duckeye extensions
        run: ./duckeye --init

      - name: Run tests
        run: ./test.sh

      # integration.sh had never run in CI. 127 assertions -- every format end to
      # end, the README's published commands executed verbatim, cross-format
      # invariants and stream hygiene -- existed and were dark, which is the same
      # shape as an assertion that never executes.
      #
      # It is a separate step rather than appended to the one above so a failure
      # names which suite failed, and so a red integration run cannot be mistaken
      # for a unit regression.
      - name: Run integration tests
        run: ./integration.sh

      # Every duck_block_utils/webbed/markdown/panduck function duckeye calls must
      # exist in the INSTALLED binary. duckeye has no build step and no vendored
      # header, so this is the only thing between a renamed upstream function and a
      # Catalog Error in a user's terminal.
      #
      # Wired only after checking two things, in this order: that it can still FAIL
      # (missing function exits 1, absent duckdb exits 2 -- a check that skips and
      # returns 0 reproduces the defect it exists to catch), and that it EXISTS in a
      # checkout. It did not: scripts/ is gitignored for operator tools and this had
      # been swept in with them.
      - name: Check every extension call resolves
        run: ./scripts/check_block_functions.sh
